<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台北捷運動態</title>
<meta name="theme-color" content="#0a59ae">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="捷運動態">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="style.css?v=20261009m">
</head>
<body>
<div id="map"></div>

<header class="bar">
  <div class="title">
    <b>台北捷運動態</b>
    <span class="sub"><span id="clock">--:--:--</span>・<span id="count">載入中…</span></span>
  </div>
  <span class="mode">依時刻表推算</span>
  <button id="info-btn" class="info-btn" aria-label="說明">i</button>
</header>

<div id="about" class="about" hidden>
  <button class="x" aria-label="關閉">✕</button>
  <b>說明</b>
  <p>列車位置是<b>依時刻表推算</b>的,不是即時資料:用各站的發車時刻和站間行駛時間,算出每一班車現在大約在哪兩站之間。台北捷運平常很準點,但誤點、臨時調度、國定假日(照星期幾的時刻表)不會反映。文湖線沒有公開的時刻表,只能依班距推估,位置僅供參考。</p>
  <p>點車站看各方向接下來的列車,點列車看它開往哪裡、下一站和預計抵達終點的時間。下方的路線可以點選,只看那一條線。</p>
  <p>時刻表來源:交通部 TDX 運輸資料流通服務。路線圖是自己畫的示意圖,不是官方路網圖。</p>
</div>

<div id="card" class="card" hidden></div>
<nav id="legend" class="legend" aria-label="路線"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script src="metro.js?v=20261009m"></script>
</body>
</html>
