<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雙北轉乘</title>
<meta name="theme-color" content="#1f62b4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雙北轉乘">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<div id="status" class="status" hidden></div>

<section id="sheet" class="sheet">
  <button id="handle" class="handle" aria-label="展開或收合"><span></span></button>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="watch" aria-selected="true">查看列表</button>
    <button role="tab" data-tab="plan" aria-selected="false">規劃路線</button>
  </nav>

  <div id="tab-watch" class="tab">
    <input id="q" class="search" type="search" placeholder="搜尋公車路線,例如 307、紅30、藍38" autocomplete="off" enterkeyhint="search">
    <ul id="results" class="list" hidden></ul>
    <ul id="watch" class="list"></ul>
    <p id="watch-empty" class="hint">搜尋路線後按「加入」,地圖上就會顯示這條路線去程和返程的車。<br>
      <span class="legend"><i class="lg go"></i>實心:去程　<i class="lg back"></i>空心:返程　箭頭是行駛方向</span></p>
  </div>

  <div id="tab-plan" class="tab" hidden>
    <div class="od">
      <div class="od-fields">
        <label class="od-row"><i class="pin o"></i><input id="from" class="search" type="search" placeholder="起點:目前位置、站名或地址" autocomplete="off" enterkeyhint="search"></label>
        <label class="od-row"><i class="pin d"></i><input id="to" class="search" type="search" placeholder="終點:站名、地標、地址,或點地圖" autocomplete="off" enterkeyhint="search"></label>
      </div>
      <button id="swap" class="icon-btn" title="起點終點交換" aria-label="起點終點交換"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg></button>
    </div>
    <ul id="places" class="list" hidden></ul>
    <p id="plan-msg" class="hint" hidden></p>
    <ul id="plans" class="list"></ul>
    <div id="plan-detail" class="list" hidden></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="app.js"></script>
<script src="plan.js"></script>
</body>
</html>
